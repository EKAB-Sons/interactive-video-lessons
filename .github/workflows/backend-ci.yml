name: Backend CI

on:
  push:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'examples/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install
      run: pip install -r requirements.txt
    - name: Compile
      run: python -m compileall app
    - name: Tests
      run: python -m pytest -q
    - name: Injection spike (recall >= 0.95, FPR == 0 enforced in tests)
      run: python -m scripts.injection_spike
    - name: Evaluation harness (seeded faults must surface)
      run: python -m app.eval ../examples/eval /tmp/eval-report.md
